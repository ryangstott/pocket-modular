name: Build app and website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  website:
    name: Publish web app and APK to GitHub Pages
    needs: apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PocketModular-apk
          path: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android project around the web app
        run: |
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap add android
          npx cap sync android

      - name: Icon, background colour and portrait lock
        run: |
          cp -r android-res/* android/app/src/main/res/
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#121519</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml

      - name: Signing key (the same key every build, so updates install over the top)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Add the KEYSTORE_PASSWORD secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/keystore.enc -out "$RUNNER_TEMP/pm.keystore" -pass env:KEYSTORE_PASSWORD
          echo "PM_KEYSTORE=$RUNNER_TEMP/pm.keystore" >> "$GITHUB_ENV"
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  pocketModular {
                      storeFile file(System.getenv("PM_KEYSTORE"))
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.pocketModular }
              }
          }
          GRADLE

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../PocketModular.apk

      - name: Check the APK is signed with the Pocket Modular key
        run: |
          unzip -p PocketModular.apk 'META-INF/*.RSA' | keytool -printcert | tee cert.txt | grep -E "Owner|SHA256"
          grep -q "CN=Pocket Modular" cert.txt || { echo "::error::APK is not signed with the Pocket Modular key"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: PocketModular-apk
          path: PocketModular.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PocketModular.apk \
            --title "Pocket Modular (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. On your phone, download PocketModular.apk and open it to install or update."
